name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 8.13 exige Gradle 8.13 como minimo.
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64. Sin el, la app no se puede actualizar sobre una version anterior."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed APK and bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Check the APK really is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::No se genero el APK firmado. Revisa la configuracion de firma."; exit 1; }
          SIGNER=$(unzip -l "$APK" | grep -oE 'META-INF/[A-Z0-9_]+\.RSA' | head -1)
          test -n "$SIGNER" || { echo "::error::El APK salio sin firmar."; exit 1; }
          echo "Firmado. Huella del certificado:"
          unzip -p "$APK" "$SIGNER" | openssl pkcs7 -inform DER -print_certs -outform PEM \
            | openssl x509 -noout -fingerprint -sha256 -subject

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: QuienEsMasProbable
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
